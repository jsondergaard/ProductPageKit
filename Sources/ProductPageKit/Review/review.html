<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product page review</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f5f7;
  --surface: #ffffff;
  --inset: #f2f2f5;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --line: #e2e2e7;
  --accent: #0066cc;
  --accent-soft: rgba(0, 102, 204, 0.1);
  --on-accent: #ffffff;
  --good: #1e7e34;
  --warn: #9a5b00;
  --warn-soft: rgba(255, 149, 0, 0.16);
  --bad: #c9001a;
  --bad-soft: rgba(215, 0, 21, 0.1);
  --added: rgba(30, 142, 62, 0.18);
  --removed: rgba(215, 0, 21, 0.14);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 1px 1px rgba(0, 0, 0, 0.03);
  --header: 60px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101012;
    --surface: #1c1c1e;
    --inset: #262628;
    --text: #f5f5f7;
    --muted: #a1a1a6;
    --line: #333336;
    --accent: #3d9bff;
    --accent-soft: rgba(61, 155, 255, 0.16);
    --on-accent: #ffffff;
    --good: #4cd964;
    --warn: #ffb340;
    --warn-soft: rgba(255, 179, 64, 0.16);
    --bad: #ff6961;
    --bad-soft: rgba(255, 105, 97, 0.14);
    --added: rgba(76, 217, 100, 0.22);
    --removed: rgba(255, 105, 97, 0.22);
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header) + 16px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
code { font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; background: var(--inset); padding: 1px 5px; border-radius: 5px; }
[hidden] { display: none !important; }

/* Header */
.top {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
}
.top-inner { display: flex; align-items: center; gap: 12px 18px; padding: 10px 20px; min-height: var(--header); flex-wrap: wrap; }
.app { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.app img { width: 32px; height: 32px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); flex: none; }
.app h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; }
.app .file { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app .names { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.controls { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.control { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }

.button {
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 5px 11px;
  font-size: 13px; cursor: pointer; line-height: 1.3; white-space: nowrap;
}
.button:hover { border-color: var(--muted); }
.button:focus-visible, .segmented button:focus-visible, select:focus-visible, .nav a:focus-visible, .thumb:focus-visible, .tile:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.button[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.button:disabled { opacity: 0.45; cursor: default; }
.button.icon { width: 30px; padding: 5px 0; text-align: center; }

.picker { display: flex; align-items: center; gap: 4px; }
select {
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 5px 8px; font-size: 13px;
  max-width: 230px;
}
.segmented { display: inline-flex; background: var(--inset); border-radius: 9px; padding: 2px; gap: 2px; max-width: 100%; overflow-x: auto; }
.segmented button {
  border: none; background: transparent; padding: 4px 11px; font-size: 13px; border-radius: 7px; cursor: pointer;
  white-space: nowrap; line-height: 1.3;
}
.segmented button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14); font-weight: 500; }
.status {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; text-decoration: none;
  padding: 5px 10px; border-radius: 8px; white-space: nowrap;
}
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.ok { color: var(--good); }
.status.warn { color: var(--warn); background: var(--warn-soft); }
.status.bad { color: var(--bad); background: var(--bad-soft); }

/* Layout */
.layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 28px; max-width: 1320px; margin: 0 auto; padding: 22px 20px 80px; }
.nav { position: sticky; top: calc(var(--header) + 22px); align-self: start; max-height: calc(100vh - var(--header) - 44px); overflow-y: auto; }
.nav h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 18px 10px 6px; font-weight: 600; }
.nav h2:first-child { margin-top: 0; }
.nav ul { list-style: none; margin: 0; padding: 0; }
.nav a {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; color: var(--text);
  text-decoration: none; font-size: 14px;
}
.nav a:hover { background: var(--inset); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.nav .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 11px; font-weight: 600; border-radius: 10px; padding: 0 7px; line-height: 18px; font-variant-numeric: tabular-nums; }
.badge.review { color: var(--warn); background: var(--warn-soft); }
.badge.bad { color: var(--bad); background: var(--bad-soft); }
.badge.plain { color: var(--muted); background: var(--inset); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }

main { min-width: 0; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.section-head h2 { font-size: 26px; line-height: 1.15; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.section-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.stack { display: grid; gap: 14px; }
.note { color: var(--muted); font-size: 14px; margin: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); }
.panel h3 { font-size: 15px; margin: 0 0 10px; }
.subhead { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 26px 0 10px; }

/* Fields */
.field { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px 16px; box-shadow: var(--shadow); container-type: inline-size; }
.field.attention { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.field.over { border-color: var(--bad); }
.field-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.field-head h3 { font-size: 13px; font-weight: 600; margin: 0; }
.field-head .spacer { flex: 1; }
.tag { font-size: 11.5px; font-weight: 500; border-radius: 6px; padding: 1px 7px; background: var(--inset); color: var(--muted); white-space: nowrap; }
.tag.review { color: var(--warn); background: var(--warn-soft); }
.tag.changed { color: var(--accent); background: var(--accent-soft); }
.tag.bad { color: var(--bad); background: var(--bad-soft); }
.count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.meter { width: 54px; height: 4px; border-radius: 2px; background: var(--inset); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.count.near .meter i { background: var(--warn); }
.count.over { color: var(--bad); font-weight: 600; }
.count.over .meter i { background: var(--bad); }
.guidance { font-size: 13px; color: var(--muted); margin: 0 0 10px; white-space: pre-wrap; background: var(--inset); border-radius: 8px; padding: 8px 11px; }
.columns { display: grid; gap: 16px; }
.columns.translation { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
/* A translation sits beside its source where there is room, and under it where there is not. */
@container (max-width: 480px) { .columns.translation { grid-template-columns: minmax(0, 1fr); gap: 10px; } }
.lang { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-bottom: 3px; letter-spacing: 0.02em; }
.source .text { color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.value {
  white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; border-radius: 8px; padding: 4px 8px; margin: -4px -8px;
  border: none; background: none; text-align: start; width: calc(100% + 16px); display: block; font: inherit; color: inherit;
}
.value:hover { background: var(--inset); }
.value:focus-visible { outline: 2px solid var(--accent); }
.value.empty { color: var(--muted); font-style: italic; }
.value.name { font-size: 24px; font-weight: 700; line-height: 1.2; }
.value.subtitle { font-size: 17px; color: var(--muted); }
.value.keywords { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--inset); border-radius: 6px; padding: 1px 8px; font-size: 13px; }
.same { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.field-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.field-actions .hint { font-size: 12px; color: var(--muted); margin-right: auto; }
textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--accent); border-radius: 10px; padding: 8px 10px;
  resize: vertical; min-height: 44px; line-height: 1.5; outline: none; box-shadow: 0 0 0 3px var(--accent-soft);
}
.diff { margin-top: 12px; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--inset); border-radius: 10px; padding: 10px 12px; }
.diff .lang { margin-bottom: 4px; }
ins { background: var(--added); text-decoration: none; border-radius: 3px; }
del { background: var(--removed); border-radius: 3px; }

/* Screenshots */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .spacer { flex: 1; }
.filmstrip { display: flex; gap: 10px; overflow-x: auto; padding: 4px 4px 12px; margin: 0 -4px 6px; scroll-snap-type: x proximity; }
.thumb {
  flex: none; border: none; padding: 0; background: none; cursor: pointer; scroll-snap-align: start; text-align: center;
  font-size: 12px; color: var(--muted); border-radius: 10px;
}
.thumb .frame { display: block; border-radius: 9px; overflow: hidden; background: var(--inset); box-shadow: 0 0 0 1px var(--line); }
.thumb img { display: block; width: 100%; height: 100%; object-fit: contain; }
.thumb[aria-current="true"] .frame { box-shadow: 0 0 0 3px var(--accent); }
.thumb[aria-current="true"] { color: var(--accent); font-weight: 600; }
.thumb .number { display: block; margin-top: 5px; }
.thumb .missing { display: flex; height: 100%; align-items: center; justify-content: center; color: var(--warn); font-size: 18px; }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 400px); gap: 22px; align-items: start; }
.detail.wide { grid-template-columns: minmax(0, 1fr); }
.preview { margin: 0; position: sticky; top: calc(var(--header) + 22px); }
.preview img { display: block; max-width: 100%; max-height: calc(100vh - var(--header) - 120px); width: auto; height: auto; margin: 0 auto; border-radius: 12px; box-shadow: 0 0 0 1px var(--line), 0 6px 24px rgba(0, 0, 0, 0.1); }
.stepper { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.placeholder {
  border-radius: 12px; background: var(--inset); display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--muted); font-size: 13px; text-align: center; padding: 20px; gap: 6px; max-height: calc(100vh - var(--header) - 120px);
  margin: 0 auto; width: 100%;
}
.placeholder strong { color: var(--text); font-size: 14px; }
.placeholder ul { margin: 4px 0 0; padding: 0; list-style: none; }
.loading { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.55; } }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell), 1fr)); gap: 16px; }
.tile { border: none; background: none; padding: 0; cursor: pointer; text-align: center; font-size: 12px; color: var(--muted); }
.tile .frame { display: block; border-radius: 9px; overflow: hidden; background: var(--inset); box-shadow: 0 0 0 1px var(--line); }
.tile img { display: block; width: 100%; height: auto; }
.tile[aria-current="true"] .frame { box-shadow: 0 0 0 3px var(--accent); }
.tile[aria-current="true"] { color: var(--accent); font-weight: 600; }
.tile .number { display: block; margin-top: 5px; }
.captions { display: grid; gap: 12px; }
.captions .field { padding: 14px 16px; }

/* Videos */
.video { width: 100%; border-radius: 12px; display: block; background: #000; }
.video-status { margin-top: 10px; font-size: 13px; color: var(--muted); }
.video-status.warn { color: var(--warn); }

/* Changes and checks */
.change { display: grid; gap: 6px; padding: 14px 0; border-top: 1px solid var(--line); }
.change:first-of-type { border-top: none; padding-top: 4px; }
.change-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.change-head a { font-weight: 600; text-decoration: none; }
.change-head a:hover { text-decoration: underline; }
.change-head span { color: var(--muted); font-size: 13px; }
.change .diff { margin-top: 0; }
.locale-list { display: flex; gap: 6px; flex-wrap: wrap; }
.problems { list-style: none; margin: 0; padding: 0; }
.problems li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.problems li:first-child { border-top: none; padding-top: 0; }
.problems .sev { flex: none; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.problems .error .sev { color: var(--bad); }
.problems .warning .sev { color: var(--warn); }
.problems .message { flex: 1; overflow-wrap: anywhere; }

.toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 20; display: grid; gap: 8px; width: min(560px, calc(100vw - 32px)); }
.toast {
  background: var(--text); color: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: 13.5px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25); display: flex; gap: 12px; align-items: center;
}
.toast.error { background: var(--bad); color: #fff; }
.toast span { flex: 1; overflow-wrap: anywhere; }
.toast button { background: none; border: none; color: inherit; cursor: pointer; font-size: 13px; opacity: 0.8; padding: 0; }

@media (max-width: 860px) {
  .detail { grid-template-columns: minmax(0, 1fr); }
  .preview { position: static; }
  .preview img, .placeholder { max-height: 70vh; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 14px 16px 60px; }
  .nav { position: static; max-height: none; overflow: visible; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .nav h2 { display: none; }
  .nav ul { display: contents; }
  .nav a { background: var(--surface); border: 1px solid var(--line); white-space: nowrap; padding: 5px 10px; }
  .nav .label { overflow: visible; }
  .top-inner { padding: 8px 16px; gap: 8px 12px; }
  .section-head h2 { font-size: 22px; }
}
@media (max-width: 560px) {
  /* Three rows of controls would hold a fifth of a phone's screen. */
  .top { position: static; }
  .controls { width: 100%; }
  .picker { flex: 1; }
  .picker select { flex: 1; max-width: none; }
  .field { padding: 14px 14px; }
  .control .caption { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="app">
      <img id="icon" alt="" hidden>
      <div class="names"><h1 id="app">Product page</h1><span class="file" id="file"></span></div>
    </div>
    <div class="controls" id="controls"></div>
  </div>
</header>
<div class="layout">
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main id="main"><p class="note">Loading…</p></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
const ui = {
  data: null, fieldsByKey: new Map(),
  // From the address: #/locale/section/detail/position, where detail is a
  // strip of screenshots or a release.
  locale: null, section: null, detail: null, position: 0,
  everyLocale: false,
  compare: "off", live: null, liveLoading: false,
  guidance: false,
  // { id, key, language, original, area }
  editing: null,
  // Screenshots by strip and locale or position, and videos by locale:
  // { list, loading, stale, error }.
  shots: new Map(), videos: new Map(),
  hash: "",
};
// Kept across renders, so a playing video does not restart on every edit.
const videoNodes = new Map();

async function api(path, options = {}) {
  const response = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  const body = await response.json();
  if (!response.ok) throw new Error(body.error || response.statusText);
  return body;
}

function el(tag, attributes = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attributes)) {
    if (name === "class") node.className = value;
    else if (name.startsWith("on")) node.addEventListener(name.slice(2), value);
    else if (value === true) node.setAttribute(name, "");
    else if (value !== false && value != null) node.setAttribute(name, value);
  }
  for (const child of children.flat(Infinity)) if (child != null && child !== false) node.append(child);
  return node;
}

function plural(count, noun) { return `${count} ${noun}${count === 1 ? "" : "s"}`; }

// Text with `code` spans, for messages that name commands.
function rich(text) {
  return text.split(/(`[^`]+`)/).map(part => part.startsWith("`") ? el("code", {}, part.slice(1, -1)) : part);
}

function toast(message, kind = "info") {
  const node = el("div", { class: `toast ${kind}`, role: kind === "error" ? "alert" : "status" }, el("span", {}, message),
    el("button", { onclick: () => node.remove(), "aria-label": "Dismiss" }, "Dismiss"));
  document.getElementById("toasts").append(node);
  if (kind !== "error") setTimeout(() => node.remove(), 2400);
}

// The copy.

function field(key) { return ui.fieldsByKey.get(key); }
function unit(key, language) { return (ui.data.values[key] || {})[language]; }
function languageFor(key, locale = ui.locale) { return field(key).translatable ? locale : ui.data.sourceLanguage; }
function valueOf(key, locale = ui.locale) { return (unit(key, languageFor(key, locale)) || {}).value || ""; }
function storeName(code) { return (ui.data.locales.find(l => l.code === code) || {}).store || code; }
function hasHistory() { return Object.keys(ui.data.committed).length > 0; }
function committedOf(key, locale = ui.locale) { return (ui.data.committed[key] || {})[languageFor(key, locale)]; }

function needsReview(key, locale = ui.locale) {
  const info = field(key);
  if (!info || !info.translatable || locale === ui.data.sourceLanguage) return false;
  const source = unit(key, ui.data.sourceLanguage);
  if (!source || !source.value) return false;
  const current = unit(key, locale);
  return !current || !current.value || current.state !== "translated";
}

function changed(key, locale = ui.locale) {
  return hasHistory() && (committedOf(key, locale) || "") !== valueOf(key, locale);
}

// Undefined when App Store Connect has no such field, such as a caption.
function liveOf(key, locale = ui.locale) {
  if (!ui.live || !ui.live[key]) return undefined;
  return ui.live[key][languageFor(key, locale)] || "";
}

function differs(key, locale = ui.locale) {
  const live = liveOf(key, locale);
  return live !== undefined && live !== valueOf(key, locale);
}

// Every catalog key a section shows, captions included.
function sectionKeys(section) {
  const keys = [...section.fields, ...section.strips.flatMap(s => s.captions.flat())];
  return [...new Set(keys)].filter(field);
}

function allKeys() { return ui.data.fields.map(f => f.key); }

function toReview(locale) { return allKeys().filter(k => needsReview(k, locale)).length; }

// Where a key is edited: its section, and its strip and position or its release.
function locate(key) {
  for (const section of ui.data.sections) {
    if (section.fields.includes(key)) {
      return { section: section.id, detail: section.kind === "releases" ? key : (section.strips[0] || {}).id || "", position: 0 };
    }
    for (const strip of section.strips) {
      const position = strip.captions.findIndex(lines => lines.includes(key));
      if (position >= 0) return { section: section.id, detail: strip.id, position };
    }
  }
  return null;
}

function sectionTitle(key) {
  const place = locate(key);
  const section = place && ui.data.sections.find(s => s.id === place.section);
  if (!section) return "";
  const strip = section.strips.find(s => s.id === place.detail);
  return strip && strip.captions.length ? `${section.title}, ${strip.name} screenshot ${place.position + 1}` : section.title;
}

// Word-level differences, so a one-word edit in a long description reads at a glance.
function diff(before, after) {
  const a = before.split(/(\s+)/), b = after.split(/(\s+)/);
  const table = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--)
    for (let j = b.length - 1; j >= 0; j--)
      table[i][j] = a[i] === b[j] ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { out.push(a[i]); i++; j++; }
    else if (table[i + 1][j] >= table[i][j + 1]) out.push(el("del", {}, a[i++]));
    else out.push(el("ins", {}, b[j++]));
  }
  while (i < a.length) out.push(el("del", {}, a[i++]));
  while (j < b.length) out.push(el("ins", {}, b[j++]));
  return out;
}

// Loading and saving.

async function load() {
  setData(await api("/api/state"));
}

function setData(data) {
  const revised = ui.data && ui.data.revision !== data.revision;
  ui.data = data;
  ui.fieldsByKey = new Map(data.fields.map(f => [f.key, f]));
  if (revised) for (const map of [ui.shots, ui.videos]) for (const entry of map.values()) entry.stale = true;
  readAddress();
  render();
}

async function save() {
  const editing = ui.editing;
  try {
    const data = await api("/api/value", { method: "PUT", body: JSON.stringify({ key: editing.key, language: editing.language, value: editing.area.value }) });
    ui.editing = null;
    setData(data);
    toast("Saved to the catalog.");
  } catch (error) { toast(error.message, "error"); }
}

async function approve(key, language) {
  try {
    setData(await api("/api/approve", { method: "POST", body: JSON.stringify({ key, language }) }));
    toast(`Approved the ${storeName(language)} translation.`);
  } catch (error) { toast(error.message, "error"); }
}

async function setCompare(mode) {
  ui.compare = mode;
  if (mode === "live" && !ui.live) {
    ui.liveLoading = true;
    render();
    try { ui.live = await api("/api/live"); }
    catch (error) {
      ui.compare = "off";
      toast(`App Store Connect: ${error.message}`, "error");
    }
    ui.liveLoading = false;
  }
  render();
}

// Fetches a list of screenshots or videos once, and again once it is stale,
// keeping the old list on screen meanwhile.
async function fetchMedia(map, key, path) {
  const entry = map.get(key);
  if (entry && (entry.loading || !entry.stale)) return;
  map.set(key, { list: entry && entry.list, loading: true, stale: false });
  try { map.set(key, { list: await api(path), loading: false, stale: false }); }
  catch (error) { map.set(key, { list: entry && entry.list, loading: false, stale: false, error: error.message }); }
  render();
}

function shotsFor(strip, locale) {
  const key = `${strip.id}|${locale}`;
  fetchMedia(ui.shots, key, `/api/screenshots?strip=${encodeURIComponent(strip.id)}&locale=${encodeURIComponent(locale)}`);
  return ui.shots.get(key);
}

function positionFor(strip, position) {
  const key = `${strip.id}#${position}`;
  fetchMedia(ui.shots, key, `/api/screenshots?strip=${encodeURIComponent(strip.id)}&position=${position}`);
  return ui.shots.get(key);
}

function videosFor(locale) {
  fetchMedia(ui.videos, locale, `/api/videos?locale=${encodeURIComponent(locale)}`);
  return ui.videos.get(locale);
}

// The address.

const statusSections = [{ id: "changes", title: "Changes" }, { id: "checks", title: "Checks" }];

function currentSection() { return ui.data.sections.find(s => s.id === ui.section); }

function readAddress() {
  const [locale, section, detail, position] = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  const data = ui.data;
  const codes = data.locales.map(l => l.code);
  ui.locale = codes.includes(locale) ? locale : codes.includes(data.sourceLanguage) ? data.sourceLanguage : codes[0];
  const ids = [...data.sections.map(s => s.id), ...statusSections.map(s => s.id)];
  ui.section = ids.includes(section) ? section : ids[0];
  const current = currentSection();
  const details = !current ? [] : current.kind === "releases" ? current.fields : current.strips.map(s => s.id);
  ui.detail = details.includes(detail) ? detail : details[0] || null;
  const strip = current && current.strips.find(s => s.id === ui.detail);
  const asked = Math.max(parseInt(position, 10) || 0, 0);
  // Without a theme there are no captions to count the shots by.
  ui.position = !strip ? 0 : strip.captions.length ? Math.min(asked, strip.captions.length - 1) : asked;
  ui.hash = address({});
}

function address(changes) {
  const next = { locale: ui.locale, section: ui.section, detail: ui.detail || "", position: ui.position, ...changes };
  return "#/" + [next.locale, next.section, next.detail, next.position].map(encodeURIComponent).join("/");
}

function go(changes) {
  const target = address(changes);
  if (target !== location.hash) location.hash = target;
}

function dirty() { return ui.editing && ui.editing.area.value !== ui.editing.original; }

window.addEventListener("hashchange", () => {
  if (dirty() && !confirm("Discard your unsaved edit?")) {
    history.replaceState(null, "", ui.hash);
    return;
  }
  ui.editing = null;
  const section = ui.section;
  readAddress();
  render();
  if (ui.section !== section) window.scrollTo({ top: 0 });
});

window.addEventListener("beforeunload", event => { if (dirty()) event.preventDefault(); });

// Header.

function renderHeader() {
  const data = ui.data;
  document.getElementById("app").textContent = data.app;
  document.title = `${data.app}: product page review`;
  const icon = document.getElementById("icon");
  icon.hidden = !data.icon;
  if (data.icon && !icon.src) icon.src = "/media/icon";
  document.getElementById("file").textContent = data.catalog;

  const index = data.locales.findIndex(l => l.code === ui.locale);
  const select = el("select", { "aria-label": "Locale", onchange: event => go({ locale: event.target.value }) },
    data.locales.map(locale => {
      const count = toReview(locale.code);
      const label = locale.store + (locale.code === data.sourceLanguage ? " (source)" : "") + (count ? `, ${count} to review` : "");
      return el("option", { value: locale.code, selected: locale.code === ui.locale }, label);
    }));
  const step = offset => go({ locale: data.locales[(index + offset + data.locales.length) % data.locales.length].code });
  const picker = el("div", { class: "picker" },
    el("button", { class: "button icon", onclick: () => step(-1), "aria-label": "Previous locale", disabled: data.locales.length < 2 }, "‹"),
    select,
    el("button", { class: "button icon", onclick: () => step(1), "aria-label": "Next locale", disabled: data.locales.length < 2 }, "›"));

  const modes = [["off", "Off"], ["commit", "Last commit"], ["live", ui.liveLoading ? "Reading…" : "App Store"]];
  const compare = el("div", { class: "control" }, el("span", { class: "caption" }, "Compare with"),
    el("div", { class: "segmented", role: "group", "aria-label": "Compare with" }, modes.map(([mode, label]) =>
      el("button", { "aria-pressed": String(ui.compare === mode), disabled: ui.liveLoading || (mode === "commit" && !hasHistory()),
        title: mode === "commit" && !hasHistory() ? "The catalog has no committed version" : false, onclick: () => setCompare(mode) }, label))));

  const guidance = el("button", { class: "button", "aria-pressed": String(ui.guidance), onclick: () => { ui.guidance = !ui.guidance; render(); } }, "Guidance");

  const errors = data.problems.filter(p => p.severity === "error").length;
  const warnings = data.problems.length - errors;
  const status = el("a", { class: "status " + (errors ? "bad" : warnings ? "warn" : "ok"), href: address({ section: "checks", detail: "", position: 0 }) },
    errors ? plural(errors, "error") : warnings ? plural(warnings, "warning") : "Ready to push");
  document.getElementById("controls").replaceChildren(picker, compare, guidance, status);
}

// Sidebar.

function renderNav() {
  const groups = [];
  for (const section of ui.data.sections) {
    let group = groups.find(g => g.title === section.group);
    if (!group) groups.push(group = { title: section.group, items: [] });
    const keys = sectionKeys(section);
    const review = keys.filter(k => needsReview(k)).length;
    const edited = keys.some(k => changed(k));
    const live = ui.compare === "live" ? keys.filter(k => differs(k)).length : 0;
    group.items.push(navItem(section.id, section.title, [
      review ? el("span", { class: "badge review", title: `${plural(review, "field")} to review in ${storeName(ui.locale)}` }, review) : null,
      live ? el("span", { class: "badge plain", title: `${plural(live, "field")} differ from the App Store` }, `${live} live`) : null,
      edited ? el("span", { class: "dot", title: "Changed since the last commit" }) : null,
    ]));
  }
  const errors = ui.data.problems.filter(p => p.severity === "error").length;
  const changes = allKeys().filter(k => changed(k)).length;
  groups.push({ title: "Review", items: [
    navItem("changes", "Changes", changes ? el("span", { class: "badge plain" }, changes) : null),
    navItem("checks", "Checks", ui.data.problems.length
      ? el("span", { class: "badge " + (errors ? "bad" : "review") }, ui.data.problems.length) : null),
  ] });
  document.getElementById("nav").replaceChildren(...groups.flatMap(group => [
    el("h2", {}, group.title), el("ul", {}, group.items.map(item => el("li", {}, item))),
  ]));
}

function navItem(id, title, badges) {
  return el("a", { href: address({ section: id, detail: "", position: 0 }), "aria-current": ui.section === id ? "page" : false },
    el("span", { class: "label" }, title), badges);
}

// A field.

function counter(value, maxLength) {
  const length = [...value].length;
  if (maxLength == null) return el("span", { class: "count" }, plural(length, "character"));
  const ratio = length / maxLength;
  return el("span", { class: "count" + (ratio > 1 ? " over" : ratio > 0.9 ? " near" : ""), title: `${length} of ${maxLength} characters` },
    el("span", { class: "meter" }, el("i", { style: `width: ${Math.min(ratio, 1) * 100}%` })), `${length} / ${maxLength}`);
}

function display(key, value, edit) {
  const attributes = { type: "button", dir: "auto", onclick: edit, "aria-label": `Edit ${field(key).title}` };
  if (!value) return el("button", { ...attributes, class: "value empty" }, "Empty. Click to write it.");
  if (key === "keywords") {
    return el("button", { ...attributes, class: "value keywords" },
      value.split(",").map(k => k.trim()).filter(Boolean).map(k => el("span", { class: "chip" }, k)));
  }
  return el("button", { ...attributes, class: `value ${key}` }, value);
}

function lineTitle(key) {
  const line = key.split(".").pop();
  return line[0].toUpperCase() + line.slice(1);
}

function fieldCard(key, options = {}) {
  const info = field(key);
  if (!info) return null;
  const data = ui.data;
  const language = languageFor(key);
  const current = unit(key, language);
  const value = current ? current.value : "";
  const translation = info.translatable && language !== data.sourceLanguage;
  const id = `${key}/${language}`;
  const editing = ui.editing && ui.editing.id === id;
  const review = needsReview(key);

  const tags = [];
  if (review) tags.push(el("span", { class: "tag review" }, !value ? "Not translated" : current.state === "new" ? "New" : "Needs review"));
  if (changed(key)) tags.push(el("span", { class: "tag changed" }, "Changed since commit"));
  if (ui.compare === "live" && differs(key)) tags.push(el("span", { class: "tag" }, "Differs from App Store"));
  const over = info.maxLength != null && [...value].length > info.maxLength;
  if (over) tags.push(el("span", { class: "tag bad" }, "Too long"));

  const edit = () => {
    if (ui.editing && ui.editing.id !== id && dirty() && !confirm("Discard your unsaved edit?")) return;
    const area = el("textarea", { dir: "auto", rows: Math.max(2, Math.min(18, value.split("\n").length + 1)), "aria-label": info.title });
    area.value = value;
    ui.editing = { id, key, language, original: value, area };
    render();
    area.focus();
  };

  const node = el("article", { class: "field" + (review ? " attention" : "") + (over ? " over" : ""), id: `field-${key}` },
    el("div", { class: "field-head" }, el("h3", {}, options.title || info.title), tags, el("span", { class: "spacer" }),
      editing ? null : counter(value, info.maxLength)));
  if (info.comment && (ui.guidance || editing)) node.append(el("p", { class: "guidance" }, info.comment));

  let target;
  if (editing) {
    const area = ui.editing.area;
    const count = el("span", {}, counter(area.value, info.maxLength));
    area.oninput = () => count.replaceChildren(counter(area.value, info.maxLength));
    area.onkeydown = event => {
      if (event.key === "Escape") { ui.editing = null; render(); }
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) save();
    };
    target = el("div", {}, translation ? el("div", { class: "lang" }, storeName(language)) : null, area,
      el("div", { class: "field-actions" }, el("span", { class: "hint" }, "⌘↩ saves, Esc cancels"), count,
        el("button", { class: "button", onclick: () => { ui.editing = null; render(); } }, "Cancel"),
        el("button", { class: "button primary", onclick: save }, "Save")));
  } else {
    target = el("div", {}, translation ? el("div", { class: "lang" }, storeName(language)) : null, display(key, value, edit));
  }

  const source = unit(key, data.sourceLanguage);
  node.append(translation
    ? el("div", { class: "columns translation" },
        el("div", { class: "source" }, el("div", { class: "lang" }, `${storeName(data.sourceLanguage)}, source`),
          el("div", { class: "text", dir: "auto" }, source && source.value ? source.value : "Empty")), target)
    : target);
  if (!info.translatable && ui.locale !== data.sourceLanguage) {
    node.append(el("p", { class: "same" }, `Not translated: the ${storeName(data.sourceLanguage)} text is used in every locale.`));
  }

  if (ui.compare === "commit" && changed(key)) {
    node.append(el("div", { class: "diff" }, el("div", { class: "lang" }, "Since the last commit"), el("div", { dir: "auto" }, diff(committedOf(key) || "", value))));
  }
  if (ui.compare === "live" && differs(key)) {
    node.append(el("div", { class: "diff" }, el("div", { class: "lang" }, "From the App Store to the catalog"), el("div", { dir: "auto" }, diff(liveOf(key), value))));
  }
  if (!editing && current && current.value && review) {
    node.append(el("div", { class: "field-actions" },
      el("button", { class: "button", onclick: edit }, "Edit"),
      el("button", { class: "button primary", onclick: () => approve(key, language) }, "Approve")));
  }
  return node;
}

// Sections.

function head(title, subtitle, ...extra) {
  return el("div", { class: "section-head" }, el("div", {}, el("h2", {}, title), subtitle ? el("p", {}, subtitle) : null), extra);
}

function localeLine() {
  return ui.locale === ui.data.sourceLanguage ? `${storeName(ui.locale)}, the source language` : storeName(ui.locale);
}

function copySection(section) {
  const cards = section.fields.map(k => fieldCard(k));
  return [head(section.title, localeLine()), el("div", { class: "stack" }, cards.length ? cards : el("p", { class: "note" }, "Nothing here yet."))];
}

function releasesSection(section) {
  if (!section.fields.length) {
    return [head(section.title, localeLine()), el("p", { class: "note" }, rich("No releases yet. `productpage release new <version>` adds one."))];
  }
  const versions = el("div", { class: "segmented", role: "group", "aria-label": "Release" }, section.fields.map(key =>
    el("button", { "aria-pressed": String(key === ui.detail), onclick: () => go({ detail: key }) },
      key.slice("whatsNew.".length), needsReview(key) ? " •" : "")));
  return [head(section.title, localeLine()), el("div", { class: "toolbar" }, versions), fieldCard(ui.detail)];
}

function segmented(label, options, current, pick) {
  return el("div", { class: "segmented", role: "group", "aria-label": label }, options.map(([value, title]) =>
    el("button", { "aria-pressed": String(value === current), onclick: () => pick(value) }, title)));
}

// The size a strip shows its screenshots at: phones tall, Macs and TVs wide.
function thumbSize(strip, height) {
  const tall = strip.height > strip.width;
  const h = tall ? height : Math.round(height * 0.62);
  return { width: Math.round(h * strip.width / strip.height), height: h };
}

function shotImage(shot, strip, alt) {
  return el("img", { src: shot.url, alt, width: strip.width, height: strip.height, decoding: "async" });
}

function placeholder(strip, shot, loading, style = "") {
  const ratio = `aspect-ratio: ${strip.width} / ${strip.height}; ${style}`;
  if (loading || !shot) return el("div", { class: "placeholder loading", style: ratio }, "Framing…");
  return el("div", { class: "placeholder", style: ratio }, el("strong", {}, "Not framed"),
    el("ul", {}, shot.problems.map(problem => el("li", {}, problem[0].toUpperCase() + problem.slice(1)))));
}

function screenshotsSection(section) {
  const nodes = [head(section.title, localeLine())];
  if (section.fields.length) nodes.push(el("div", { class: "stack" }, section.fields.map(k => fieldCard(k))), el("h3", { class: "subhead" }, "Screenshots"));
  const strip = section.strips.find(s => s.id === ui.detail);
  if (!strip) {
    nodes.push(el("p", { class: "note" }, "No screenshots on any configured platform."));
    return nodes;
  }
  const toolbar = el("div", { class: "toolbar" });
  if (section.strips.length > 1) toolbar.append(segmented("Platform", section.strips.map(s => [s.id, s.name]), strip.id, id => go({ detail: id, position: 0 })));
  toolbar.append(el("span", { class: "spacer" }));
  if (ui.data.locales.length > 1) {
    toolbar.append(segmented("Show", [[false, "This locale"], [true, "Every locale"]], ui.everyLocale, value => { ui.everyLocale = value; render(); }));
  }
  nodes.push(toolbar);

  const entry = shotsFor(strip, ui.locale);
  const shots = entry && entry.list ? entry.list : [];
  if (entry && entry.error) nodes.push(el("p", { class: "note" }, entry.error));
  const count = strip.captions.length || shots.length;
  const size = thumbSize(strip, matchMedia("(max-width: 560px)").matches ? 112 : 168);
  nodes.push(el("div", { class: "filmstrip", role: "list" }, Array.from({ length: count }, (_, position) => {
    const shot = shots.find(s => s.position === position);
    const frame = shot && shot.url ? shotImage(shot, strip, "")
      : shot ? el("span", { class: "missing", title: shot.problems.join("\n") }, "!") : null;
    return el("button", { class: "thumb", role: "listitem", "aria-current": String(position === ui.position),
      "aria-label": `Screenshot ${position + 1}${shot && !shot.url ? ", not framed" : ""}`, onclick: () => go({ position }) },
      el("span", { class: "frame" + (frame ? "" : " loading"), style: `width: ${size.width}px; height: ${size.height}px` }, frame),
      el("span", { class: "number" }, position + 1));
  })));

  const captions = strip.captions[ui.position];
  const step = offset => go({ position: (ui.position + offset + count) % count });
  const stepper = el("div", { class: "stepper" },
    el("button", { class: "button icon", onclick: () => step(-1), "aria-label": "Previous screenshot", disabled: count < 2 }, "‹"),
    `Screenshot ${ui.position + 1} of ${count}`,
    el("button", { class: "button icon", onclick: () => step(1), "aria-label": "Next screenshot", disabled: count < 2 }, "›"));

  let view;
  if (ui.everyLocale) {
    const across = positionFor(strip, ui.position);
    const list = across && across.list ? across.list : [];
    const cell = Math.max(thumbSize(strip, 260).width, 150);
    view = el("div", {}, el("div", { class: "tiles", style: `--cell: ${cell}px` }, ui.data.locales.map(locale => {
      const shot = list.find(s => s.locale === locale.code);
      return el("button", { class: "tile", "aria-current": String(locale.code === ui.locale), title: `Show ${locale.store}`,
        onclick: () => { ui.everyLocale = false; go({ locale: locale.code }); } },
        el("span", { class: "frame" }, shot && shot.url ? shotImage(shot, strip, `${locale.store}`) : placeholder(strip, shot, across && across.loading, "border-radius: 0")),
        el("span", { class: "number" }, locale.store));
    })), stepper);
  } else {
    const shot = shots.find(s => s.position === ui.position);
    view = el("figure", { class: "preview" },
      shot && shot.url ? shotImage(shot, strip, `Screenshot ${ui.position + 1} in ${storeName(ui.locale)}`) : placeholder(strip, shot, !entry || entry.loading),
      stepper);
  }
  // Every locale's screenshots need the width; their captions go underneath.
  const detail = el("div", { class: "detail" + (captions && !ui.everyLocale ? "" : " wide") }, view);
  if (captions) detail.append(el("div", { class: "captions" }, captions.map(k => fieldCard(k, { title: lineTitle(k) }))));
  nodes.push(detail);
  if (shots.some(s => !s.url)) {
    nodes.push(el("p", { class: "note", style: "margin-top: 16px" }, rich("`productpage screenshots capture` takes the missing captures.")));
  }
  return nodes;
}

function videoSection(section) {
  const nodes = [head(section.title, localeLine())];
  const entry = videosFor(ui.locale);
  const video = entry && entry.list ? entry.list.find(v => v.kind === section.video) : null;
  const panel = el("div", { class: "panel" });
  if (!video) {
    panel.append(el("div", { class: "placeholder loading", style: "aspect-ratio: 16 / 7" }, entry && entry.error ? entry.error : "Loading…"));
  } else {
    if (video.url) {
      if (!videoNodes.has(video.url)) {
        const node = el("video", { class: "video", src: video.url, autoplay: true, muted: true, loop: true, playsinline: true, controls: true });
        node.muted = true;
        videoNodes.set(video.url, node);
      }
      panel.append(videoNodes.get(video.url));
    } else {
      panel.append(el("div", { class: "placeholder", style: `aspect-ratio: ${video.width} / ${video.height}` }, el("strong", {}, "Not rendered yet")));
    }
    const status = video.problems.length
      ? el("div", { class: "video-status warn" }, `It cannot be rendered in ${storeName(ui.locale)} yet: `, video.problems.join("; "), ".")
      : !video.url ? el("div", { class: "video-status" }, rich("`productpage videos render` renders it."))
      : !video.current ? el("div", { class: "video-status warn" }, rich("Out of date: its caption or captures changed since it was rendered. `productpage videos render` renders it again."))
      : el("div", { class: "video-status" }, "Up to date.");
    panel.append(status);
  }
  nodes.push(panel, el("h3", { class: "subhead" }, "Caption"), el("div", { class: "captions" }, section.fields.map(k => fieldCard(k, { title: lineTitle(k) }))));
  return nodes;
}

function changeEntry(key, before, after, label) {
  const place = locate(key);
  return el("div", { class: "change" },
    el("div", { class: "change-head" },
      el("a", { href: place ? address(place) : "#" }, field(key).title),
      el("span", {}, sectionTitle(key))),
    el("div", { class: "diff" }, el("div", { class: "lang" }, label), el("div", { dir: "auto" }, diff(before, after))));
}

function changesSection() {
  const nodes = [head("Changes", localeLine())];
  if (!hasHistory()) {
    nodes.push(el("p", { class: "note" }, "The catalog has no committed version to compare with."));
  } else {
    const keys = allKeys().filter(k => changed(k));
    const panel = el("div", { class: "panel" }, el("h3", {}, "Since the last commit"));
    panel.append(...(keys.length ? keys.map(k => changeEntry(k, committedOf(k) || "", valueOf(k), storeName(languageFor(k))))
      : [el("p", { class: "note" }, `Nothing changed in ${storeName(ui.locale)}.`)]));
    nodes.push(panel);
    const elsewhere = ui.data.locales.filter(l => l.code !== ui.locale)
      .map(l => ({ locale: l, count: allKeys().filter(k => field(k).translatable && changed(k, l.code)).length })).filter(e => e.count);
    if (elsewhere.length) {
      nodes.push(el("div", { class: "panel", style: "margin-top: 14px" }, el("h3", {}, "Changed in other locales"),
        el("div", { class: "locale-list" }, elsewhere.map(e => el("a", { class: "button", href: address({ locale: e.locale.code }) },
          `${e.locale.store}: ${e.count}`)))));
    }
  }
  const live = el("div", { class: "panel", style: "margin-top: 14px" }, el("h3", {}, "Against the App Store"));
  if (!ui.live) {
    live.append(el("p", { class: "note" }, "Reads what App Store Connect shows now. Nothing is changed there."),
      el("div", { class: "field-actions", style: "justify-content: flex-start" },
        el("button", { class: "button", disabled: ui.liveLoading, onclick: () => setCompare("live") }, ui.liveLoading ? "Reading…" : "Compare with the App Store")));
  } else {
    const keys = allKeys().filter(k => differs(k));
    live.append(...(keys.length ? keys.map(k => changeEntry(k, liveOf(k), valueOf(k), `App Store to catalog, ${storeName(languageFor(k))}`))
      : [el("p", { class: "note" }, `The App Store matches the catalog in ${storeName(ui.locale)}.`)]));
  }
  nodes.push(live);
  return nodes;
}

function checkTarget(problem) {
  const place = problem.key && locate(problem.key);
  return place ? address({ ...place, locale: problem.locale || ui.locale }) : null;
}

function checksSection() {
  const problems = [...ui.data.problems].sort((a, b) => (a.severity === "error" ? 0 : 1) - (b.severity === "error" ? 0 : 1));
  const nodes = [head("Checks", rich("What `productpage metadata check` finds, in every locale."))];
  if (!problems.length) {
    nodes.push(el("div", { class: "panel" }, el("p", { class: "note" }, "Every check passes.")));
    return nodes;
  }
  nodes.push(el("div", { class: "panel" }, el("ul", { class: "problems" }, problems.map(problem => {
    const target = checkTarget(problem);
    return el("li", { class: problem.severity }, el("span", { class: "sev" }, problem.severity), el("span", { class: "message" }, problem.message),
      target ? el("a", { href: target }, "Show") : null);
  }))));
  return nodes;
}

// Rendering.

function render() {
  if (!ui.data) return;
  const area = ui.editing && ui.editing.area;
  const focused = area && document.activeElement === area;
  const selection = focused ? [area.selectionStart, area.selectionEnd] : null;
  renderHeader();
  renderNav();
  const section = currentSection();
  const content = !section ? (ui.section === "changes" ? changesSection() : checksSection())
    : section.kind === "releases" ? releasesSection(section)
    : section.kind === "screenshots" ? screenshotsSection(section)
    : section.kind === "video" ? videoSection(section)
    : copySection(section);
  document.getElementById("main").replaceChildren(...content.flat().filter(Boolean));
  if (focused) {
    area.focus();
    area.setSelectionRange(...selection);
  }
  for (const node of videoNodes.values()) if (node.isConnected && node.paused) node.play().catch(() => {});
}

document.addEventListener("keydown", event => {
  if (!ui.data || event.metaKey || event.ctrlKey || event.altKey) return;
  if (event.target.closest("textarea, input, select")) return;
  const section = currentSection();
  if (!section || section.kind !== "screenshots" || ui.everyLocale) return;
  const strip = section.strips.find(s => s.id === ui.detail);
  const count = strip ? strip.captions.length || (shotsFor(strip, ui.locale) || {}).list?.length || 0 : 0;
  if (!count) return;
  if (event.key === "ArrowRight") go({ position: (ui.position + 1) % count });
  if (event.key === "ArrowLeft") go({ position: (ui.position - 1 + count) % count });
});

// Edits made elsewhere, in Xcode or by an agent, and new captures or videos
// show up within two seconds, except while something is being edited here.
setInterval(async () => {
  if (!ui.data || ui.editing) return;
  try {
    const { revision } = await api("/api/revision");
    if (revision !== ui.data.revision) await load();
  } catch {}
}, 2000);

load().catch(error => {
  document.getElementById("main").replaceChildren(el("p", { class: "note" }, error.message));
});
</script>
</body>
</html>
